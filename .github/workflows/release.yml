name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Ad-hoc sign and repackage DMG
        run: |
          APP_PATH="src-tauri/target/release/bundle/macos/AgentPrism.app"
          VERSION="${{ github.ref_name }}"
          DMG_OUT="src-tauri/target/release/bundle/dmg/AgentPrism_${VERSION}.dmg"

          codesign --deep --force --sign - "$APP_PATH"

          STAGING=$(mktemp -d)
          cp -r "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "AgentPrism" -srcfolder "$STAGING" -ov -format UDZO "$DMG_OUT"
          rm -rf "$STAGING"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: |
            src-tauri/target/release/bundle/dmg/AgentPrism_${{ github.ref_name }}.dmg
